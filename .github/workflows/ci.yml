name: CI

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - eli-cli/Cargo.toml
      - eli-cli/src/**
      - eli-cli/tests/**
      - eli-lib/Cargo.toml
      - eli-lib/src/**
      - eli-lib/tests/**
      - tests/e2e/**
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - eli-cli/Cargo.toml
      - eli-cli/src/**
      - eli-cli/tests/**
      - eli-lib/Cargo.toml
      - eli-lib/src/**
      - eli-lib/tests/**
      - tests/e2e/**
      - .github/workflows/ci.yml

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-stable
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Run unit tests
        run: cargo +stable test --workspace

      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets -- -D warnings

      - name: Run Windows boot-disk E2E test
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -NoProfile -File tests/e2e/windows.ps1

      - name: Run Linux boot-disk E2E test
        if: runner.os == 'Linux'
        shell: bash
        run: bash tests/e2e/linux.sh

      - name: Run macOS boot-disk E2E test
        if: runner.os == 'macOS'
        shell: bash
        run: bash tests/e2e/macos.sh
