[package]
name = "eli-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "eli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eli-lib = { path = "../eli-lib" }

[target.'cfg(windows)'.dependencies]
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
] }
