[package]
name = "eli-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "eli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
eli-lib = { path = "../eli-lib" }

[target.'cfg(windows)'.dependencies]
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "raw-window-handle-06",
    "compat-1-2",
] }
i-slint-backend-winit = { version = "1.17", default-features = false, features = [
    "renderer-software",
] }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
