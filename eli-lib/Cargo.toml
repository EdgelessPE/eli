[package]
name = "eli-lib"
version = "0.1.0"
edition = "2024"

[features]
default = ["loadscreen-bake"]
loadscreen-bake = ["dep:image", "dep:tar", "dep:webp"]

[dependencies]
fs2 = "0.4"
image = { version = "0.25", optional = true, default-features = false, features = [
    "bmp",
    "ico",
    "jpeg",
    "png",
    "tga",
    "tiff",
    "webp",
] }
tar = { version = "0.4", optional = true }
webp = { version = "0.3.1", optional = true, default-features = false }
indicatif = "0.17"
isomage = { version = "2.1", default-features = false, features = ["iso", "udf"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2.5"

[target.'cfg(windows)'.dependencies]
slint = { version = "1.17", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "raw-window-handle-06",
    "compat-1-2",
] }
i-slint-backend-winit = { version = "1.17", default-features = false, features = [
    "renderer-software",
] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "webp",
] }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
